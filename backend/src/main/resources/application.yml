spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:h2:mem:urlshortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    cache-names: shortUrls

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  shortener:
    public-base-url: http://localhost:8080
    code-length: 8
    max-create-attempts: 10
    default-ttl: 365d
    blocked-hosts:
      - localhost
      - 127.0.0.1
      - 0.0.0.0
